<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thajusunna Pilathara (TSS) Fund</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      /* Modern Emerald-Slate Cohesive Palette */
      --bg: #f8fafc;       /* Slate 50 */
      --c: #ffffff;        /* Pure Surface White */
      --t: #0f172a;        /* Slate 900 Text */
      --m: #64748b;        /* Slate 500 Muted */
      --g: #059669;        /* Emerald 600 Primary */
      --g-deep: #064e3b;   /* Emerald 900 Deep */
      --b: #e2e8f0;        /* Slate 200 Border */
      --ok: #059669;       /* Emerald 600 Paid */
      --no: #e11d48;       /* Rose 600 Unpaid */
      --pe: #d97706;       /* Amber 600 Pending */
      --ip: #2563eb;       /* Blue 600 In Progress */
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #020617;     /* Slate 950 */
        --c: #0f172a;      /* Slate 900 Surface */
        --t: #f8fafc;      /* Slate 50 Text */
        --m: #94a3b8;      /* Slate 400 Muted */
        --g: #10b981;      /* Emerald 500 Primary */
        --b: #334155;      /* Slate 700 Border */
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--t);
      font: 15px system-ui, -apple-system, sans-serif;
      padding-bottom: 70px;
    }
    header {
      background: linear-gradient(135deg, #064e3b, #059669);
      color: #fff;
      padding: 16px 18px;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    header small { opacity: .85; }
    .bar { display: flex; gap: 10px; padding: 12px 14px; flex-wrap: wrap; }
    .card {
      background: var(--c);
      border: 1px solid var(--b);
      border-radius: 16px; /* 16px softer contemporary border-radius */
      padding: 14px;
      margin: 10px 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .big { font-size: 24px; font-weight: 800; }
    .m { color: var(--m); font-size: 12px; }
    select, input, button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--b);
      background: var(--c);
      color: var(--t);
    }
    input, select { width: 100%; }
    button { cursor: pointer; font-weight: 600; }
    .p { background: var(--g); color: #fff; border: 0; }
    .p:hover { opacity: .92; }
    .seg { display: flex; border: 1px solid var(--b); border-radius: 12px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; flex: 1; padding: 8px; }
    .seg .on { background: var(--g); color: #fff; }
    .chip { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; color: #fff; white-space: nowrap; }
    .Paid { background: var(--ok); }
    .Unpaid { background: var(--no); }
    .Pending { background: var(--pe); }
    .Inprogress { background: var(--ip); }
    .prog { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--b); margin: 10px 0; }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: var(--c);
      border-top: 1px solid var(--b);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    nav button { flex: 1; border: 0; background: none; color: var(--m); padding: 12px 4px; font-size: 12px; }
    nav .on { color: var(--g); font-weight: 700; }
    .li { padding: 12px 0; border-bottom: 1px solid var(--b); }
    .li:last-child { border: 0; }
    dialog {
      width: 92%;
      max-width: 440px;
      border: 1px solid var(--b);
      border-radius: 16px;
      background: var(--c);
      color: var(--t);
    }
  </style>
</head>
<body>
  <header>
    <h1>Thajusunna Pilathara (TSS)</h1>
    <small>Monthly fund collection · 2026</small>
  </header>
  <div class="bar">
    <div class="seg" style="flex:1" id="cur"></div>
    <select id="mon" style="flex:1"></select>
  </div>
  <main id="v"></main>
  <nav id="nav"></nav>
  <dialog id="dlg"></dialog>
  <script>
    const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    let cur = "AED", mi = 10, tab = "a", q = "";
    const S = {
      M: [
        {n:"Azeez KC",mo:"507607968",a:250,c:"AED",mn:"ALL",s:"Paid"},
        {n:"Mohammed Ali AT",mo:"559336123",a:300,c:"AED",mn:"JAN",s:"Paid"},
        {n:"Muujeeb KP",mo:"501527927",a:250,c:"AED",mn:"JAN",s:"Paid"},
        {n:"Asharaf Haji",mo:"506733580",a:250,c:"AED",mn:"FEB",s:"Paid"},
        {n:"Abdulla T",mo:"505714977",a:250,c:"AED",mn:"FEB",s:"Paid"},
        {n:"Sidheeq Karipayi",mo:"",a:200,c:"AED",mn:"MAR",s:"Paid"},
        {n:"Hakeem KP",mo:"547385365",a:600,c:"AED",mn:"MAR",s:"Paid"},
        {n:"Kamarudheen Tp",mo:"556538992",a:400,c:"AED",mn:"MAR",s:"Paid"},
        {n:"Majeed AT",mo:"508786447",a:250,c:"AED",mn:"APR",s:"Paid"},
        {n:"Ashiq dhaher",mo:"",a:150,c:"AED",mn:"APR",s:"Paid"},
        {n:"Jabir Kp",mo:"527931293",a:250,c:"AED",mn:"APR",s:"Paid"},
        {n:"Fasil PS",mo:"552299263",a:250,c:"AED",mn:"APR",s:"Paid"},
        {n:"Hashim KP",mo:"567877411",a:250,c:"AED",mn:"APR",s:"Paid"},
        {n:"Hashm KC",mo:"9745807373",a:360,c:"AED",mn:"APR",s:"Paid"}
      ]
    };
    function f(c,a){return c==="AED"?"AED "+a:"₹ "+a}
    function st(m){return m.s||"Unpaid"}
    function due(m){return m.mn==="ALL"||m.mn===MON[mi]}

    function listData(){let L,t;const a=tab==="a",mt=m=>q?m.n.toLowerCase().includes(q.toLowerCase()):a||due(m);
     L=S.M.filter(m=>m.c===cur&&mt(m));
     if(a){L.sort((x,y)=>MON.indexOf(x.mn)-MON.indexOf(y.mn));t="TSS Fund - Full member list ("+cur+")"}
     else t="TSS Fund - "+MON[mi]+" 2026 ("+cur+")";
     const rows=L.map(m=>{const s=st(m);return{n:m.n,mo:m.mo||"no number",a:f(m.c,m.a),mn:m.mn,s:s==="Inprogress"?"In progress":s}});
     return{t,rows,total:L.reduce((s,m)=>s+m.a,0)}}

    function shareBtns(){return `<button style="background:#25d366;color:#fff;border:0" onclick="shareText()">WhatsApp</button><button onclick="shareImg()">Image</button>`}

    function all(){const D=listData();return `<div class="card"><input placeholder="Search name, phone, month…" value="${q}" oninput="q=this.value;go(1)"><div class="gap" style="display:flex;align-items:center;gap:8px;margin-top:8px">${shareBtns()}<span class="m" style="margin-left:auto">${D.rows.length} members · Total ${f(cur,D.total)}</span></div></div><div class="card">`+
     D.rows.map((r,i)=>`<div class="li"><div class="row"><b>${i+1}. ${r.n}</b><b style="color:var(--g)">${r.a}</b></div><div class="row m" style="margin-top:4px"><span style="display:flex;align-items:center;gap:6px">📞 ${r.mo !== "no number" ? `<a href="tel:${r.mo}" style="color:inherit;text-decoration:none;font-weight:600">${r.mo}</a> · <a href="https://wa.me/${r.mo}" target="_blank" style="color:#25d366;text-decoration:none;font-weight:700">Chat</a>` : `<span style="font-style:italic">no number</span>`}</span><span>Month: ${r.mn}</span></div></div>`).join("")+"</div>"}

    function shareText(){const D=listData(),a=tab==="a";
     const s="*"+D.t+"*\n\n"+D.rows.map((r,i)=>(i+1)+". "+r.n+" - "+r.mo+" - "+r.a+" - Month "+r.mn).join("\n")+"\n\n*Total: "+f(cur,D.total)+"*";
     if(window.Android&&window.Android.shareText)window.Android.shareText(s);else window.open("https://wa.me/?text="+encodeURIComponent(s))}

    function shareImg(){const D=listData(),a=tab==="a",W=720,H=124+D.rows.length*54,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
     x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#0f766e";x.fillRect(0,0,W,64);x.fillStyle="#fff";x.font="bold 24px sans-serif";x.fillText(D.t,16,40);
     D.rows.forEach((r,i)=>{const y=64+i*54;if(i%2){x.fillStyle="#f3f6f4";x.fillRect(0,y,W,54)}
      x.textAlign="left";x.fillStyle="#14231c";x.font="bold 20px sans-serif";x.fillText((i+1)+". "+r.n,16,y+24);
      x.font="16px sans-serif";x.fillStyle="#66776e";x.fillText(r.mo+" · Month "+r.mn,16,y+46);
      x.textAlign="right";x.fillStyle="#14231c";x.font="bold 20px sans-serif";x.fillText(r.a,W-16,y+32)});
     x.textAlign="left";x.font="bold 22px sans-serif";x.fillStyle="#0f766e";x.fillText("Total: "+f(cur,D.total),16,H-24);
     const d=c.toDataURL("image/png");
     if(window.Android&&window.Android.shareImage)window.Android.shareImage(d.split(",")[1]);else{const l=document.createElement("a");l.href=d;l.download="tss-list.png";l.click()}}

    function renderNav(){
      document.getElementById("nav").innerHTML = `
        <button class="${tab==='m'?'on':''}" onclick="tab='m';renderNav();go()">Monthly Due</button>
        <button class="${tab==='a'?'on':''}" onclick="tab='a';renderNav();go()">Full List</button>
      `;
    }

    function go(keepSearch){
      document.getElementById("v").innerHTML = all();
    }

    window.onload = function(){
      document.getElementById("cur").innerHTML = `<button class="${cur==='AED'?'on':''}" onclick="cur='AED';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on');go()">AED</button><button class="${cur==='INR'?'on':''}" onclick="cur='INR';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on');go()">INR</button>`;
      document.getElementById("mon").innerHTML = MON.map((m,i)=>`<option value="${i}" ${i===mi?'selected':''}>${m} 2026</option>`).join("");
      document.getElementById("mon").onchange = function(e){ mi = parseInt(e.target.value); go(); };
      renderNav();
      go();
    };
  </script>
</body>
</html>
